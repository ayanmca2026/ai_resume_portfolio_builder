{% extends "base.html" %}

{% block content %}
<div class="glass-card" style="max-width: 600px; margin: 0 auto;">
    <h1 class="text-gradient" style="margin-bottom: 2rem;">Build Resume</h1>
    
    <form action="/resume/build" method="post" style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div>
            <label for="target_role" style="display: block; margin-bottom: 0.5rem;">Target Role</label>
            <input type="text" id="target_role" name="target_role" class="input-field" required placeholder="e.g. Senior Software Engineer" style="width: 100%;">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn-primary">Generate Resume</button>
            <a href="/resume" class="btn-secondary" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
