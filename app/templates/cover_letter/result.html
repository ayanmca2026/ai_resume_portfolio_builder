{% extends "base.html" %}

{% block content %}
<div class="glass-card max-w-4xl mx-auto mt-10 p-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gradient">Your Cover Letter</h1>
        <button onclick="copyToClipboard()" class="btn-secondary px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded transition border border-gray-600 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            Copy Text
        </button>
    </div>
    
    <p class="text-gray-400 mb-6">Generated for <strong>{{ role }}</strong> at <strong>{{ company }}</strong>.</p>
    
    <div class="bg-gray-800/80 border border-gray-700 p-8 rounded-xl">
        <pre id="cover-letter-text" class="whitespace-pre-wrap font-sans text-gray-200 leading-relaxed text-sm md:text-base">{{ cover_letter }}</pre>
    </div>
    
    <div class="mt-8 flex justify-center gap-4">
        <a href="/cover-letter" class="btn-secondary px-6 py-2 rounded text-white bg-gray-700 hover:bg-gray-600 transition border border-gray-600">Generate Another</a>
        <a href="/" class="btn-secondary px-6 py-2 rounded text-white bg-gray-800 hover:bg-gray-700 transition border border-gray-700">Back to Dashboard</a>
    </div>
</div>

<script>
function copyToClipboard() {
    const text = document.getElementById('cover-letter-text').innerText;
    navigator.clipboard.writeText(text).then(() => {
        alert("Cover letter copied to clipboard!");
    }).catch(err => {
        console.error('Failed to copy text: ', err);
    });
}
</script>
{% endblock %}
