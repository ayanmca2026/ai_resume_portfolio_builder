{% extends "base.html" %}

{% block content %}
<div class="glass-card p-6">
    <h2 class="text-2xl font-bold mb-4 text-gradient">Interview Simulator</h2>
    
    {% if questions %}
    <div class="space-y-6">
        {% for q in questions %}
        <div class="glass-card p-4">
            <p class="font-bold text-lg mb-2">{{ q }}</p>
            <form method="POST" action="/career/interview/evaluate" class="flex flex-col space-y-2">
                <input type="hidden" name="question" value="{{ q }}">
                <textarea name="answer" class="input-field p-2 rounded" rows="3" placeholder="Your answer..." required></textarea>
                <button type="submit" class="btn-secondary w-fit">Evaluate</button>
            </form>
        </div>
        {% endfor %}
    </div>
    {% endif %}
</div>
{% endblock %}
