{% extends "base.html" %}

{% block content %}
<div class="glass-card p-6">
    <h2 class="text-2xl font-bold mb-4 text-gradient">Evaluation Result</h2>
    
    <div class="mb-4">
        <h3 class="font-bold">Question:</h3>
        <p>{{ question }}</p>
    </div>
    <div class="mb-4">
        <h3 class="font-bold">Your Answer:</h3>
        <p class="italic">{{ answer }}</p>
    </div>
    <div class="glass-card p-4">
        <h3 class="font-bold text-gradient mb-2">Feedback:</h3>
        <p>{{ evaluation }}</p>
    </div>
    
    <a href="/career/interview" class="btn-primary mt-6 inline-block">Try Another Question</a>
</div>
{% endblock %}
