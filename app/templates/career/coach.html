{% extends "base.html" %}

{% block content %}
<div class="glass-card p-6">
    <h2 class="text-2xl font-bold mb-4 text-gradient">Career Coach</h2>
    
    <div class="mb-6">
        <form method="POST" action="/career/coach" class="flex flex-col space-y-4">
            <label class="text-lg">Ask your coach a question:</label>
            <textarea name="message" class="input-field p-3 rounded" rows="4" placeholder="e.g. How do I transition to Data Science?" required></textarea>
            <button type="submit" class="btn-primary w-fit">Send</button>
        </form>
    </div>

    {% if answer %}
    <div class="glass-card p-4 mt-6">
        <h3 class="font-bold mb-2">You asked:</h3>
        <p class="mb-4 italic">{{ question }}</p>
        <h3 class="font-bold mb-2 text-gradient">Coach says:</h3>
        <p>{{ answer }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
