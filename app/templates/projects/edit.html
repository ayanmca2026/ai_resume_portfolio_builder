{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-8 animate-fade-in">
    <div class="flex items-center justify-between">
        <h1 class="text-4xl font-bold">Edit Project</h1>
        <a href="/projects" class="btn-secondary">Cancel</a>
    </div>

    <form action="/projects/{{ project.id }}/edit" method="post" class="space-y-6 glass-card p-8 rounded-xl border border-gray-800">
        <div>
            <label class="block text-sm text-gray-400 mb-1">Project Name *</label>
            <input type="text" name="name" required class="input-field w-full" value="{{ project.name or '' }}">
        </div>
        
        <div>
            <label class="block text-sm text-gray-400 mb-1">Technologies (Comma separated)</label>
            <input type="text" name="technologies" class="input-field w-full" value="{{ project.technologies or '' }}">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">GitHub URL</label>
                <input type="url" name="github_url" class="input-field w-full" value="{{ project.github_url or '' }}">
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Live URL</label>
                <input type="url" name="live_url" class="input-field w-full" value="{{ project.live_url or '' }}">
            </div>
        </div>

        <div>
            <label class="block text-sm text-gray-400 mb-1">Your Role</label>
            <input type="text" name="role" class="input-field w-full" value="{{ project.contribution or '' }}">
        </div>

        <div>
            <label class="block text-sm text-gray-400 mb-1">Problem / Description</label>
            <textarea name="problem" class="input-field w-full h-24">{{ project.problem or '' }}</textarea>
        </div>

        <div>
            <label class="block text-sm text-gray-400 mb-1">Solution / Approach</label>
            <textarea name="solution" class="input-field w-full h-24">{{ project.solution or '' }}</textarea>
        </div>

        <button type="submit" class="btn-primary w-full py-4 text-lg font-bold">Update Project</button>
    </form>

    <form action="/projects/{{ project.id }}/delete" method="post" class="text-center">
        <button type="submit" class="text-red-400 hover:text-red-300 text-sm underline" onclick="return confirm('Are you sure you want to delete this project?')">Delete this project</button>
    </form>
</div>
{% endblock %}
