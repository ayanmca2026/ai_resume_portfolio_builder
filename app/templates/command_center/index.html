{% extends "base.html" %}

{% block content %}
<div class="glass-card p-6">
    <h2 class="text-2xl font-bold mb-4 text-gradient">Command Center</h2>
    
    <form method="POST" action="/command-center/" class="mb-8">
        <div class="flex space-x-4">
            <input type="text" name="command" class="input-field flex-grow p-3 rounded" placeholder="What do you want to do? (e.g. 'Analyze my skills', 'Generate an interview question')" required>
            <button type="submit" class="btn-primary">Execute</button>
        </div>
    </form>

    {% if result %}
    <div class="glass-card p-6 mt-6">
        <h3 class="text-xl font-bold mb-2">Result:</h3>
        <div class="mb-4">
            <span class="px-2 py-1 bg-gray-700 rounded text-sm uppercase font-bold">{{ result.action }}</span>
        </div>
        <div class="whitespace-pre-wrap">{{ result.message }}</div>
    </div>
    {% endif %}
</div>
{% endblock %}
