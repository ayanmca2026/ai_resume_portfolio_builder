<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ settings.APP_NAME if settings else 'CAREER OS' }}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-light font-sans antialiased min-h-screen flex flex-col">
    {% block nav %}
    <nav class="glass-nav sticky top-0 z-50 p-4 border-b border-gray-800">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-tight text-gradient">CAREER OS</a>
            <div class="space-x-4">
                {% if user %}
                    <a href="/dashboard" class="text-sm font-medium hover:text-primary transition">Dashboard</a>
                    <a href="/auth/logout" class="text-sm font-medium text-gray-400 hover:text-white transition">Logout</a>
                {% else %}
                    <a href="/auth/login" class="text-sm font-medium hover:text-primary transition">Login</a>
                    <a href="/auth/register" class="btn-primary">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    {% endblock %}

    <main class="flex-grow container mx-auto p-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-gray-800 p-6 text-center text-sm text-gray-500">
        &copy; 2026 CAREER OS. AI Engineered.
    </footer>
</body>
</html>
