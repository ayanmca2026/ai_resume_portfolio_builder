{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto glass-card p-8 rounded-2xl mt-16">
    <h2 class="text-3xl font-bold mb-6 text-center">Create Account</h2>
    {% if error %}
    <div class="bg-red-500 bg-opacity-20 border border-red-500 text-red-300 p-3 rounded-lg mb-4 text-sm">
        {{ error }}
    </div>
    {% endif %}
    <form action="/auth/register" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Full Name</label>
            <input type="text" name="full_name" required class="input-field w-full">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
            <input type="email" name="email" required class="input-field w-full">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
            <input type="password" name="password" required class="input-field w-full">
        </div>
        <button type="submit" class="btn-primary w-full py-3 mt-4">Sign Up</button>
    </form>
    <p class="text-center mt-6 text-sm text-gray-500">
        Already have an account? <a href="/auth/login" class="text-primary hover:underline">Login</a>
    </p>
</div>
{% endblock %}
